[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claim-check"
version = "0.1.0"
description = "Check a coding agent's 'all tests pass' against mechanical evidence, and keep a receipt"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Muhammad Moeez Khan" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/MuhammadMoeezKhan/claim-check"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
claim-check = "claimcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
